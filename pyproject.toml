[project]
name = "cyclic-peptide"
version = "0.1.0"
description = "Pipeline that turns cyclic-peptide patents into a structured SMILES + bioactivity dataset."
requires-python = ">=3.11,<3.14"
dependencies = [
    "decimer>=2.8.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "rapidocr>=3.9.2",
    "rdkit>=2026.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The sub-packages have to be listed as well.  Leaving them out
# builds a wheel that contains ``cpd`` but not ``cpd.ocr`` and
# ``cpd.parsers``, so ``pip install .`` produces a package that
# cannot run the pipeline.
packages = ["cpd", "cpd.ocr", "cpd.parsers"]

[tool.setuptools.package-dir]
"cpd" = "src/cpd"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
# Only the project's own test suite.  ``references/`` holds upstream
# vendor code with its own tests, and ``experiments/`` holds one-off
# analysis scripts that are not meant to be collected as unit tests.
testpaths = ["tests"]
norecursedirs = [
    "references",
    "experiments",
    "analysis",
    "data",
    ".venv",
    ".git",
]

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D401", # First line should be in imperative mood
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
